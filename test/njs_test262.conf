# Configuration for the native test262 runner, build/njs_test262.  In
# [exclude], a trailing '*' matches a path prefix.

[config]

# strict, non-strict or both.  njs implements ES5.1 strict mode only, so a
# non-strict or a raw variant is reported as a capability skip.
mode=strict

# yes, no or skip.  "no" removes the tests from the manifest, "skip" keeps
# them listed together with the reason.
async=yes
module=yes

[features]

# A test262 feature has to be listed here for a case using it to be executed.
# A bare name or "yes" means supported, "skip" means selected and reported as
# skipped.  A feature that is not listed at all is reported as unknown and
# skipped, so that a feature added to test262 is never executed silently.
#
# Keep this list sorted case-insensitively.

